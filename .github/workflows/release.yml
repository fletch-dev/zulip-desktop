name: Build Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          rm -f pnpm-lock.yaml package-lock.json
          pnpm add electron-vite@6.0.0-beta.1 -D
          pnpm install

      - name: Build
        run: node --run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'
          FORCE_COLOR: '0'
          ELECTRON_DISABLE_SANDBOX: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
